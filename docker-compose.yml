services:
  # -----------------------
  # Database (PostGIS)
  # -----------------------
  db:
    # Используем образ с поддержкой ARM64 и векторными расширениями
    image: postgis/postgis:16-3.4
    container_name: app_postgis
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------
  # Cache (Redis)
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    platform: linux/arm64
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------
  # Admin UI (PGAdmin)
  # -----------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: app_pgadmin
    restart: unless-stopped
    platform: linux/arm64
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # Важно для стабильности на Mac
      PGADMIN_CONFIG_SESSION_TIMEOUT: '0'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  # -----------------------
  # Backend (NestJS)
  # -----------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # Указываем платформу для сборки, чтобы соответствовала хосту
      platforms:
        - linux/arm64
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  pgadmin_data:
    driver: local

networks:
  app-network:
    driver: bridge